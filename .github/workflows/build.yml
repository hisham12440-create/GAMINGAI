name: Build Superior

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superior-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure x64
        shell: pwsh
        run: |
          cmd /c 'cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON > configure.log 2>&1'
          $code = $LASTEXITCODE
          Get-Content configure.log
          if ($code -ne 0) {
            Get-Content configure.log -Tail 60 | ForEach-Object { Write-Output "::error title=CMake configure::$_" }
            exit $code
          }
      - name: Build Release and HLSL
        shell: pwsh
        run: |
          cmd /c 'cmake --build build --parallel > build.log 2>&1'
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 150
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern 'error [A-Z]+[0-9]+|fatal error|FAILED' | Select-Object -First 30 | ForEach-Object { Write-Output "::error title=Windows build::$($_.Line)" }
            exit $code
          }
      - name: CPU-only unit tests
        shell: pwsh
        run: |
          cmd /c 'ctest --test-dir build --output-on-failure --no-tests=error > tests.log 2>&1'
          $code = $LASTEXITCODE
          Get-Content tests.log
          if ($code -ne 0) {
            Select-String -Path tests.log -Pattern 'Failure|Expected|Actual|Value of|FAILED|error|Exception' | Select-Object -First 30 | ForEach-Object { Write-Output "::error title=CPU tests::$($_.Line)" }
            exit $code
          }
      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Superior-ci-logs
          path: |
            configure.log
            build.log
            tests.log
          if-no-files-found: ignore
      - name: Verify static CRT and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents build\Superior.exe
          $imports | Write-Host
          if ($imports -match 'VCRUNTIME|MSVCP') { throw 'Dynamic CRT detected; Release must use /MT.' }
          $stage = 'artifacts/Superior'
          New-Item -ItemType Directory -Force -Path $stage, "$stage/shaders", "$stage/config", "$stage/models", "$stage/licenses" | Out-Null
          Copy-Item build\Superior.exe $stage
          Copy-Item build\shaders\*.cso "$stage/shaders"
          Copy-Item shaders\present.hlsl "$stage/shaders"
          Copy-Item config\settings.example.json "$stage/config"
          Copy-Item models\README.txt "$stage/models"
          Copy-Item README.md, docs\KNOWN_LIMITATIONS.md "$stage"
          Copy-Item build\_deps\imgui-src\LICENSE.txt "$stage/licenses/Dear-ImGui.txt"
          Copy-Item build\_deps\json-src\LICENSE.MIT "$stage/licenses/nlohmann-json.txt"
          Copy-Item build\_deps\harfbuzz-src\COPYING "$stage/licenses/HarfBuzz.txt"
          Copy-Item build\_deps\googletest-src\LICENSE "$stage/licenses/GoogleTest.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath artifacts/Superior-windows-x64.zip -Force
          $hashes = Get-FileHash build\Superior.exe, artifacts\Superior-windows-x64.zip -Algorithm SHA256
          $hashes | Format-List
          $hashes | ForEach-Object { "$(($_.Hash).ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
          $hashes | ForEach-Object { Write-Output "::notice title=Artifact SHA256::$(Split-Path $_.Path -Leaf) $($_.Hash)" }
      - name: Upload Superior.exe
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Superior-exe
          path: build/Superior.exe
          if-no-files-found: error
      - name: Upload portable package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Superior-windows-x64
          path: |
            artifacts/Superior-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
