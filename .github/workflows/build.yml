name: Build Superior

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superior-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CONFIGURATION_TYPES=Release -DBUILD_TESTING=ON
      - name: Build Release and HLSL
        run: cmake --build build --config Release --parallel
      - name: CPU-only unit tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Verify static CRT and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents build\Release\Superior.exe
          $imports | Write-Host
          if ($imports -match 'VCRUNTIME|MSVCP') { throw 'Dynamic CRT detected; Release must use /MT.' }
          $stage = 'artifacts/Superior'
          New-Item -ItemType Directory -Force -Path $stage, "$stage/shaders", "$stage/config", "$stage/models", "$stage/licenses" | Out-Null
          Copy-Item build\Release\Superior.exe $stage
          Copy-Item build\Release\shaders\*.cso "$stage/shaders"
          Copy-Item shaders\present.hlsl "$stage/shaders"
          Copy-Item config\settings.example.json "$stage/config"
          Copy-Item models\README.txt "$stage/models"
          Copy-Item README.md, docs\KNOWN_LIMITATIONS.md "$stage"
          Copy-Item build\_deps\imgui-src\LICENSE.txt "$stage/licenses/Dear-ImGui.txt"
          Copy-Item build\_deps\json-src\LICENSE.MIT "$stage/licenses/nlohmann-json.txt"
          Copy-Item build\_deps\harfbuzz-src\COPYING "$stage/licenses/HarfBuzz.txt"
          Copy-Item build\_deps\googletest-src\LICENSE "$stage/licenses/GoogleTest.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath artifacts/Superior-windows-x64.zip -Force
          Get-FileHash build\Release\Superior.exe, artifacts\Superior-windows-x64.zip -Algorithm SHA256 | Format-List
      - name: Upload Superior.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Superior-exe
          path: build/Release/Superior.exe
          if-no-files-found: error
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Superior-windows-x64
          path: artifacts/Superior-windows-x64.zip
          if-no-files-found: error
